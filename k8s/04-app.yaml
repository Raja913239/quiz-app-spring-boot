# ---------- 1. Deployment: runs the quiz app pods ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-app
spec:
  replicas: 1                                  # we'll scale this up later
  selector:
    matchLabels:
      app: quiz-app
  template:
    metadata:
      labels:
        app: quiz-app
    spec:
      containers:
        - name: quiz-app
          image: ghcr.io/raja913239/quiz-app:latest   # your image from GHCR
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://db:5432/questiondb   # "db" = the Service from step 6
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quiz-db-secret
                  key: DB_PASSWORD
          resources:
            requests:                          # what the pod is guaranteed
              cpu: 250m
              memory: 256Mi
            limits:                            # the most it may use
              memory: 512Mi
          startupProbe:                        # give Spring Boot up to 150 s to start
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:                       # stuck? -> restart the container
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:                      # not ready? -> no traffic to this pod
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
---
# ---------- 2. Service: opens the app on http://localhost:8080 ----------
apiVersion: v1
kind: Service
metadata:
  name: quiz-app
spec:
  type: LoadBalancer
  selector:
    app: quiz-app
  ports:
    - port: 8080
      targetPort: 8080