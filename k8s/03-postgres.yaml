# ---------- 1. Storage: keeps database files when the pod restarts ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quiz-db-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# ---------- 2. Deployment: runs one PostgreSQL pod ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-db
spec:
  replicas: 1
  strategy:
    type: Recreate                     # stop the old pod before starting a new one (one DB owns the disk)
  selector:
    matchLabels:
      app: quiz-db
  template:
    metadata:
      labels:
        app: quiz-db
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: questiondb
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quiz-db-secret     # the Secret from step 4
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "questiondb"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: quiz-db-data
        - name: init
          configMap:
            name: quiz-db-init             # the ConfigMap from step 5
---
# ---------- 3. Service: a stable name "db" other pods use to reach PostgreSQL ----------
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: quiz-db
  ports:
    - port: 5432
      targetPort: 5432